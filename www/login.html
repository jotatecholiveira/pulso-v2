  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body.login-page {
      min-height: 100dvh;
      font-family: 'Inter', -apple-system, sans-serif;
      overflow-x: hidden;
      color: #1a1a2e;
    }

    /* === SPLASH SCREEN === */
    .splash-screen {
      position: fixed; inset: 0; z-index: 100;
      background: linear-gradient(160deg, #FF6B6B 0%, #ee5a24 50%, #FF8E53 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 24px;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .splash-screen.hidden { opacity: 0; transform: scale(1.05); pointer-events: none; }
    .splash-logo {
      width: 100px; height: 100px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      display: flex; align-items: center; justify-content: center;
      font-size: 44px; font-weight: 800; color: #fff;
      font-family: 'Fraunces', serif;
      animation: splashPulse 2s ease-in-out infinite;
      box-shadow: 0 8px 40px rgba(0,0,0,0.15);
    }
    @keyframes splashPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .splash-title { font-family: 'Fraunces', serif; font-size: 2.5rem; font-weight: 700; color: #fff; letter-spacing: -1px; }
    .splash-subtitle { font-size: 1rem; color: rgba(255,255,255,0.8); max-width: 260px; text-align: center; line-height: 1.5; }
    .splash-dots { display: flex; gap: 8px; margin-top: 16px; }
    .splash-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); animation: dotBounce 1.4s ease-in-out infinite; }
    .splash-dot:nth-child(2) { animation-delay: 0.2s; }
    .splash-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }

    /* === SPLIT LAYOUT === */
    .login-split {
      display: flex;
      min-height: 100dvh;
    }

    /* === LEFT PANEL — FORM === */
    .login-left {
      flex: 0 0 420px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 48px;
      position: relative;
      z-index: 2;
      transition: background 0.8s ease, color 0.8s ease;
      background: #fff;
      color: #1a1a2e;
    }
    body.dark-mode .login-left {
      background: #0d1117;
      color: #e9ecef;
    }

    .login-brand {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 32px;
    }
    .login-brand-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #FF6B6B, #ee5a24);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 800; color: #fff;
      font-family: 'Fraunces', serif;
    }
    .login-brand-name {
      font-family: 'Fraunces', serif;
      font-size: 1.4rem; font-weight: 700;
    }

    .login-heading {
      font-size: 1.6rem; font-weight: 800;
      margin-bottom: 4px; line-height: 1.2;
      transition: color 0.5s ease;
    }
    .login-tagline {
      font-size: 0.88rem; color: #868e96; margin-bottom: 20px;
    }
    body.dark-mode .login-tagline { color: #6c7a8d; }

    .daily-quote {
      font-size: 0.78rem; color: #adb5bd; font-style: italic;
      margin-bottom: 22px; line-height: 1.5;
      min-height: 2.4em;
      transition: color 0.5s ease;
    }
    body.dark-mode .daily-quote { color: #484f58; }

    /* === TABS (hidden but kept for JS) === */
    .auth-tabs {
      position: absolute; width: 0; height: 0; overflow: hidden; opacity: 0; pointer-events: none;
    }
    body.dark-mode .auth-tabs { background: #161b22; }
    .auth-tab {
      flex: 1; padding: 11px 0; text-align: center;
      font-size: 0.88rem; font-weight: 600;
      color: #868e96; background: none; border: none;
      border-radius: 11px; cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1), color 0.5s ease;
      position: relative; z-index: 1;
    }
    .auth-tab.active { color: #1a1a2e; }
    body.dark-mode .auth-tab.active { color: #fff; }
    .auth-tab-indicator {
      position: absolute; top: 4px; left: 4px;
      width: calc(50% - 4px); height: calc(100% - 8px);
      background: #fff; border-radius: 11px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    body.dark-mode .auth-tab-indicator { background: #0d1117; }
    .auth-tab-indicator.right { transform: translateX(100%); }

    /* === AUTH MESSAGE === */
    .auth-msg {
      padding: 12px 16px; border-radius: 12px;
      font-size: 0.85rem; margin-bottom: 16px;
      display: none; animation: shakeIn 0.4s ease;
    }
    .auth-msg.error { background: #fff5f5; border: 1px solid #ffc9c9; color: #e03131; }
    .auth-msg.info { background: #fff0f0; border: 1px solid #ffd8d8; color: #FF6B6B; }
    .auth-msg.success { background: #ebfbee; border: 1px solid #b2f2bb; color: #2b8a3e; }
    body.dark-mode .auth-msg.error { background: #2d1215; border-color: #5c1a1f; color: #ff6b6b; }
    body.dark-mode .auth-msg.info { background: #1a1218; border-color: #3d1f2a; color: #ff8a8a; }
    body.dark-mode .auth-msg.success { background: #0d1f15; border-color: #1a4d2e; color: #4ade80; }
    @keyframes shakeIn { 0% { transform: translateX(-8px); opacity: 0; } 50% { transform: translateX(4px); } 100% { transform: translateX(0); opacity: 1; } }

    .gmail-hint {
      display: none;
    }

    /* === GOOGLE BUTTON === */
    .btn-google-new {
      width: 100%; display: flex; align-items: center; justify-content: center;
      gap: 12px; padding: 14px 20px;
      background: #fff; border: 1.5px solid #e9ecef;
      border-radius: 14px; color: #495057;
      font-size: 0.92rem; font-weight: 500;
      cursor: pointer; transition: all 0.3s ease; margin-bottom: 16px;
    }
    body.dark-mode .btn-google-new { background: #161b22; border-color: #30363d; color: #e9ecef; }
    .btn-google-new:hover { border-color: #dee2e6; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    body.dark-mode .btn-google-new:hover { border-color: #484f58; }
    .btn-google-new:active { transform: scale(0.98); }
    .btn-google-new svg { width: 20px; height: 20px; flex-shrink: 0; }

    /* === DIVIDER === */
    .or-divider {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 16px; color: #adb5bd;
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1px;
      transition: color 0.5s ease;
    }
    body.dark-mode .or-divider { color: #484f58; }
    .or-divider::before, .or-divider::after {
      content: ''; flex: 1; height: 1px; background: #e9ecef;
    }
    body.dark-mode .or-divider::before,
    body.dark-mode .or-divider::after { background: #30363d; }

    /* === FORM INPUTS === */
    .input-group-new { position: relative; margin-bottom: 14px; }
    .input-group-new input {
      width: 100%; padding: 16px 48px 8px 16px;
      background: #f8f9fa; border: 1.5px solid #e9ecef;
      border-radius: 14px; color: #1a1a2e;
      font-size: 0.92rem; font-family: inherit; outline: none;
      transition: all 0.3s ease;
    }
    body.dark-mode .input-group-new input {
      background: #161b22; border-color: #30363d; color: #e9ecef;
    }
    .input-group-new input:focus {
      border-color: #FF6B6B; background: #fff;
      box-shadow: 0 0 0 3px rgba(255,107,107,0.1);
    }
    body.dark-mode .input-group-new input:focus { background: #0d1117; }
    .input-group-new label {
      position: absolute; top: 14px; left: 16px;
      font-size: 0.88rem; color: #868e96;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1), color 0.5s ease;
    }
    .input-group-new input:focus + label,
    .input-group-new input:not(:placeholder-shown) + label {
      top: 6px; left: 16px; font-size: 0.68rem;
      color: #FF6B6B; letter-spacing: 0.3px;
      text-transform: uppercase; font-weight: 600;
    }
    .input-group-new .toggle-pass {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; color: #adb5bd;
      cursor: pointer; font-size: 0.9rem; padding: 4px;
      transition: color 0.2s, color 0.5s ease;
    }
    body.dark-mode .input-group-new .toggle-pass { color: #484f58; }
    .input-group-new .toggle-pass:hover { color: #495057; }
    body.dark-mode .input-group-new .toggle-pass:hover { color: #8b949e; }

    /* === OPTIONS === */
    .auth-options {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; font-size: 0.82rem;
    }
    .remember-check { display: flex; align-items: center; gap: 8px; color: #495057; cursor: pointer; }
    body.dark-mode .remember-check { color: #8b949e; }
    .remember-check input[type="checkbox"] { width: 16px; height: 16px; accent-color: #FF6B6B; cursor: pointer; }
    .forgot-link { color: #FF6B6B; text-decoration: none; font-weight: 500; transition: opacity 0.2s; }
    .forgot-link:hover { opacity: 0.8; }

    /* === SUBMIT === */
    .btn-primary-new {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, #FF6B6B, #ee5a24);
      border: none; border-radius: 14px; color: #fff;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative; overflow: hidden;
    }
    .btn-primary-new:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,107,107,0.35); }
    .btn-primary-new:active { transform: translateY(0) scale(0.98); }
    .btn-primary-new:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

    /* === REGISTER FIELDS === */
    .register-fields { display: none; }
    .register-fields.show { display: block; animation: slideDown 0.3s ease; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    /* === BOTTOM === */
    .login-bottom { text-align: center; margin-top: 20px; font-size: 0.82rem; color: #868e96; line-height: 1.6; }
    body.dark-mode .login-bottom { color: #6c7a8d; }
    .login-bottom strong { color: #FF6B6B; cursor: pointer; }

    .trust-row { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
    .trust-item { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; color: #adb5bd; transition: color 0.5s ease; }
    body.dark-mode .trust-item { color: #484f58; }
    .trust-item i { color: #51cf66; font-size: 0.65rem; }

    /* === RIGHT PANEL — LANDSCAPE === */
    .login-right {
      flex: 1;
      position: relative;
      overflow: hidden;
      transition: background 0.8s ease;
    }

    .landscape {
      position: absolute; inset: 0;
      transition: background 0.8s ease;
    }

    /* DAY SKY */
    .landscape-day {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, #87CEEB 0%, #B0E0E6 40%, #E0F7FA 100%);
      opacity: 1;
      transition: opacity 0.8s ease;
      z-index: 0;
      pointer-events: none;
    }
    body.dark-mode .landscape-day { opacity: 0; }
    body.dark .landscape-day { opacity: 0; }

    .landscape-day .sun {
      position: absolute;
      width: 120px; height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #FFF9C4, #FFD54F, #FFB300);
      box-shadow: 0 0 60px rgba(255,193,7,0.5), 0 0 120px rgba(255,177,0,0.2);
      top: 12%;
      right: 15%;
      animation: sunPulse 4s ease-in-out infinite;
      transition: opacity 0.8s ease;
    }
    @keyframes sunPulse {
      0%, 100% { box-shadow: 0 0 60px rgba(255,193,7,0.5), 0 0 120px rgba(255,177,0,0.2); }
      50% { box-shadow: 0 0 80px rgba(255,193,7,0.6), 0 0 160px rgba(255,177,0,0.3); }
    }

    .landscape-day .cloud-layer {
      position: absolute; inset: 0;
      pointer-events: none;
    }

    .lg-cloud {
      position: absolute;
      background: rgba(255,255,255,0.9);
      border-radius: 60px;
      animation: cloudDrift linear infinite;
    }
    .lg-cloud::before, .lg-cloud::after {
      content: ''; position: absolute; background: inherit; border-radius: 50%;
    }
    .lg-cloud-1 { width: 160px; height: 50px; top: 18%; left: -10%; animation-duration: 45s; }
    .lg-cloud-1::before { width: 70px; height: 70px; top: -35px; left: 30px; }
    .lg-cloud-1::after { width: 50px; height: 50px; top: -20px; left: 80px; }

    .lg-cloud-2 { width: 120px; height: 40px; top: 30%; left: -15%; animation-duration: 55s; animation-delay: -15s; opacity: 0.8; }
    .lg-cloud-2::before { width: 55px; height: 55px; top: -28px; left: 22px; }
    .lg-cloud-2::after { width: 38px; height: 38px; top: -16px; left: 62px; }

    .lg-cloud-3 { width: 140px; height: 45px; top: 42%; left: -12%; animation-duration: 65s; animation-delay: -30s; opacity: 0.7; }
    .lg-cloud-3::before { width: 60px; height: 60px; top: -30px; left: 28px; }
    .lg-cloud-3::after { width: 42px; height: 42px; top: -18px; left: 72px; }

    .lg-cloud-4 { width: 100px; height: 32px; top: 25%; left: -8%; animation-duration: 50s; animation-delay: -8s; opacity: 0.6; }
    .lg-cloud-4::before { width: 45px; height: 45px; top: -22px; left: 18px; }
    .lg-cloud-4::after { width: 30px; height: 30px; top: -12px; left: 52px; }

    @keyframes cloudDrift {
      0% { transform: translateX(0); }
      100% { transform: translateX(calc(100vw + 200px)); }
    }

    /* PIXEL ART OCEAN CANVAS */
    #ocean-canvas {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 42%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      z-index: 2;
    }

    /* NIGHT SKY */
    .landscape-night {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, #0a0e27 0%, #141852 40%, #1a1a2e 100%);
      opacity: 0;
      transition: opacity 0.8s ease;
      z-index: 0;
      pointer-events: none;
    }
    body.dark-mode .landscape-night { opacity: 1; }

    .landscape-night .stars {
      position: absolute; inset: 0;
      pointer-events: none;
    }
    .landscape-night .star {
      position: absolute;
      width: 2px; height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle 3s ease-in-out infinite alternate;
    }
    @keyframes twinkle { 0% { opacity: 0.3; } 100% { opacity: 1; } }

    .landscape-night .moon {
      position: absolute;
      width: 100px; height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f0f0f0, #c8c8c8, #a0a0a0);
      box-shadow: 0 0 40px rgba(200,200,220,0.3), 0 0 80px rgba(200,200,220,0.1);
      top: 14%;
      right: 18%;
    }
    .landscape-night .moon::before {
      content: ''; position: absolute;
      width: 20px; height: 20px; border-radius: 50%;
      background: rgba(0,0,0,0.08);
      top: 25px; left: 30px;
    }
    .landscape-night .moon::after {
      content: ''; position: absolute;
      width: 12px; height: 12px; border-radius: 50%;
      background: rgba(0,0,0,0.06);
      top: 55px; left: 55px;
    }

    /* === THEME PILL (inside landscape) === */
    .landscape-pill {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 10;
      width: 170px;
      height: 52px;
      border-radius: 26px;
      cursor: pointer;
      overflow: hidden;
      border: none;
      outline: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      transition: box-shadow 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .landscape-pill:focus-visible { box-shadow: 0 0 0 3px rgba(255,255,255,0.5); }
    .lp-bg {
      position: absolute; inset: 0; border-radius: 26px;
      overflow: hidden; transition: background 0.8s ease;
    }
    .landscape-pill[data-theme="light"] .lp-bg {
      background: linear-gradient(135deg, #7ec8e3, #a8d8ea, #c9e8f5);
    }
    .landscape-pill[data-theme="dark"] .lp-bg {
      background: linear-gradient(135deg, #0a0e27, #141852, #0d1137);
    }
    .lp-stars {
      position: absolute; inset: 0; opacity: 0;
      transition: opacity 0.8s ease;
    }
    .landscape-pill[data-theme="dark"] .lp-stars { opacity: 1; }
    .lp-stars::before, .lp-stars::after {
      content: ''; position: absolute; width: 2px; height: 2px;
      background: #fff; border-radius: 50%;
      box-shadow:
        12px 8px 0 0 rgba(255,255,255,0.6), 28px 14px 0 0 rgba(255,255,255,0.4),
        45px 6px 0 0 rgba(255,255,255,0.7), 60px 20px 0 0 rgba(255,255,255,0.3),
        80px 10px 0 0 rgba(255,255,255,0.5), 100px 22px 0 0 rgba(255,255,255,0.4),
        120px 8px 0 0 rgba(255,255,255,0.6), 140px 18px 0 0 rgba(255,255,255,0.3),
        18px 24px 0 0 rgba(255,255,255,0.5), 55px 30px 0 0 rgba(255,255,255,0.4);
    }
    .lp-stars::after {
      box-shadow:
        8px 18px 0 0 rgba(255,255,255,0.3), 35px 4px 0 0 rgba(255,255,255,0.5),
        72px 26px 0 0 rgba(255,255,255,0.4), 105px 6px 0 0 rgba(255,255,255,0.6);
    }
    .lp-clouds {
      position: absolute; inset: 0; opacity: 0;
      transition: opacity 0.8s ease;
    }
    .landscape-pill[data-theme="light"] .lp-clouds { opacity: 1; }
    .lp-cloud {
      position: absolute; background: rgba(255,255,255,0.85); border-radius: 50px;
    }
    .lp-cloud::before, .lp-cloud::after { content: ''; position: absolute; background: inherit; border-radius: 50%; }
    .lp-c1 { width: 32px; height: 10px; top: 12px; left: 10px; }
    .lp-c1::before { width: 14px; height: 14px; top: -8px; left: 6px; }
    .lp-c1::after { width: 10px; height: 10px; top: -5px; left: 17px; }
    .lp-c2 { width: 24px; height: 8px; top: 28px; left: 22px; }
    .lp-c2::before { width: 10px; height: 10px; top: -6px; left: 4px; }
    .lp-c2::after { width: 8px; height: 8px; top: -4px; left: 12px; }
    .lp-c3 { width: 20px; height: 7px; top: 18px; left: 50px; opacity: 0.7; }
    .lp-c3::before { width: 8px; height: 8px; top: -5px; left: 3px; }
    .lp-c3::after { width: 6px; height: 6px; top: -3px; left: 9px; }
    .lp-disc {
      position: absolute; top: 5px; left: 5px;
      width: 42px; height: 42px; border-radius: 50%;
      z-index: 3; pointer-events: none;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background 0.5s ease, box-shadow 0.5s ease;
    }
    .landscape-pill[data-theme="light"] .lp-disc {
      transform: translateX(118px);
      background: radial-gradient(circle at 40% 40%, #fff9e6, #ffe066, #ffb347);
      box-shadow: 0 0 16px rgba(255,200,50,0.5), 0 0 32px rgba(255,170,50,0.2);
    }
    .landscape-pill[data-theme="dark"] .lp-disc {
      transform: translateX(0);
      background: radial-gradient(circle at 35% 35%, #e8e8e8, #c0c0c0, #a0a0a0);
      box-shadow: inset -4px -2px 4px rgba(0,0,0,0.15), 0 0 12px rgba(200,200,220,0.3);
    }
    .lp-disc::before { content: ''; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: rgba(0,0,0,0.08); top: 12px; left: 14px; }
    .lp-disc::after { content: ''; position: absolute; width: 5px; height: 5px; border-radius: 50%; background: rgba(0,0,0,0.06); top: 24px; left: 22px; }
    .lp-label {
      position: absolute; top: 50%; transform: translateY(-50%);
      font-family: inherit; font-size: 0.6rem; font-weight: 700;
      letter-spacing: 0.8px; text-transform: uppercase;
      z-index: 2; transition: opacity 0.4s ease; pointer-events: none;
    }
    .lp-label-day { right: 14px; color: rgba(255,255,255,0.9); text-shadow: 0 1px 3px rgba(0,0,0,0.15); }
    .landscape-pill[data-theme="light"] .lp-label-day { opacity: 1; }
    .landscape-pill[data-theme="dark"] .lp-label-day { opacity: 0; }
    .lp-label-night { left: 14px; color: rgba(255,255,255,0.85); text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
    .landscape-pill[data-theme="dark"] .lp-label-night { opacity: 1; }
    .landscape-pill[data-theme="light"] .lp-label-night { opacity: 0; }

    /* Landscape branding */
    .landscape-brand {
      position: absolute;
      bottom: 200px; left: 48px;
      z-index: 5;
      color: #fff;
      text-shadow: 0 2px 20px rgba(0,0,0,0.3);
      transition: opacity 0.8s ease;
      pointer-events: none;
    }
    .landscape-brand h2 {
      font-family: 'Fraunces', serif;
      font-size: 1.8rem; font-weight: 700;
      margin-bottom: 8px;
    }
    .landscape-brand p {
      font-size: 0.9rem;
      opacity: 0.85;
      max-width: 300px;
    }

    /* === RESPONSIVE === */
    @media (max-width: 900px) {
      .login-split { flex-direction: column; }
      .login-left { flex: none; padding: 24px; min-height: auto; }
      .login-right { min-height: 200px; order: -1; }
      .landscape-brand { display: none; }
      .landscape-pill { top: 12px; right: 12px; }
    }
    @media (max-width: 480px) {
      .login-left { padding: 20px 16px; }
      .landscape-pill { width: 150px; height: 46px; }
      .lp-disc { width: 38px; height: 38px; }
      .landscape-pill[data-theme="light"] .lp-disc { transform: translateX(104px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .lp-disc, .lp-stars, .lp-clouds, .lp-bg,
      .landscape-day, .landscape-night,
      .lg-cloud, .sun, .star { transition-duration: 0.01ms !important; animation: none !important; }
    }
  </style>
</head>

      <!-- PIXEL ART OCEAN CANVAS -->
      <canvas id="ocean-canvas"></canvas>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script>
    // Generate stars
    (function() {
      const c = document.getElementById('starsContainer');
      if (!c) return;
      for (let i = 0; i < 80; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 70 + '%';
        s.style.animationDelay = (Math.random() * 3) + 's';
        s.style.width = s.style.height = (Math.random() * 2 + 1) + 'px';
        s.style.opacity = Math.random() * 0.7 + 0.3;
        c.appendChild(s);
      }
    })();

    // ============================================================
    // PIXEL ART OCEAN — Sunset & Night (arcade pixel art style)
    // ============================================================
    (function() {
      const canvas = document.getElementById('ocean-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      const LW = 320, LH = 180;
      let frame = 0;
      let fadeAlpha = 0;

      function isNight() {
        return document.body.classList.contains('dark-mode') || document.body.classList.contains('dark');
      }

      canvas.width = LW;
      canvas.height = LH;
      canvas.style.width = '100%';
      canvas.style.height = '100%';

      function px(x, y, r, g, b) {
        x = Math.floor(x); y = Math.floor(y);
        if (x < 0 || x >= LW || y < 0 || y >= LH) return;
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(x, y, 1, 1);
      }

      function rect(x, y, w, h, r, g, b) {
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
      }

      function lerp(a, b, t) { return Math.round(a + (b - a) * Math.max(0, Math.min(1, t))); }
      function lerpColor(c1, c2, t) { return [lerp(c1[0],c2[0],t), lerp(c1[1],c2[1],t), lerp(c1[2],c2[2],t)]; }

      // =================== SUNSET SCENE ===================
      const HORIZON = 95;

      function drawSunsetSky() {
        for (let y = 0; y < HORIZON; y++) {
          const t = y / HORIZON;
          let c;
          if (t < 0.15) c = lerpColor([140,50,90], [200,80,100], t/0.15);
          else if (t < 0.35) c = lerpColor([200,80,100], [230,130,60], (t-0.15)/0.2);
          else if (t < 0.6) c = lerpColor([230,130,60], [245,180,50], (t-0.35)/0.25);
          else c = lerpColor([245,180,50], [255,220,100], (t-0.6)/0.4);
          rect(0, y, LW, 1, c[0], c[1], c[2]);
        }
      }

      function drawSun(time) {
        const sx = 160, sy = HORIZON - 5;
        const r = 22;
        for (let dy = -r; dy <= r; dy++) {
          for (let dx = -r; dx <= r; dx++) {
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > r) continue;
            const t = dist / r;
            const c = lerpColor([255,240,120], [255,200,60], t);
            px(sx+dx, sy+dy, c[0], c[1], c[2]);
          }
        }
        // Glow
        for (let dy = -r-4; dy <= r+4; dy++) {
          for (let dx = -r-4; dx <= r+4; dx++) {
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < r || dist > r+4) continue;
            const glow = 1 - (dist - r) / 4;
            if (Math.random() < glow * 0.3) {
              px(sx+dx, sy+dy, 255, 200, 80);
            }
          }
        }
      }

      function drawSunCloud(x, y, w, h) {
        for (let dy = 0; dy < h; dy++) {
          for (let dx = 0; dx < w; dx++) {
            const edge = Math.sin(dx * 0.5) * 2 + Math.sin(dx * 0.8) * 1;
            if (dy < h/2 + edge && dy > -edge) {
              const t = dy / h;
              px(x+dx, y+dy, lerp(240,220,t), lerp(150,130,t), lerp(120,110,t));
            }
          }
        }
      }

      function drawBird(x, y, time) {
        const wingUp = Math.sin(time * 0.15 + x * 0.1) > 0;
        if (wingUp) {
          px(x-2,y-1, 60,40,50); px(x-1,y, 60,40,50); px(x,y, 60,40,50);
          px(x+1,y, 60,40,50); px(x+2,y-1, 60,40,50);
        } else {
          px(x-2,y, 60,40,50); px(x-1,y-1, 60,40,50); px(x,y, 60,40,50);
          px(x+1,y-1, 60,40,50); px(x+2,y, 60,40,50);
        }
      }

      function drawMountain(points, cr, cg, cb) {
        for (let i = 0; i < points.length - 1; i++) {
          const [x1, y1] = points[i];
          const [x2, y2] = points[i+1];
          const steps = Math.max(Math.abs(x2-x1), Math.abs(y2-y1));
          for (let s = 0; s <= steps; s++) {
            const t = steps === 0 ? 0 : s / steps;
            const x = lerp(x1, x2, t);
            const y = lerp(y1, y2, t);
            for (let fy = y; fy < HORIZON; fy++) px(x, fy, cr, cg, cb);
          }
        }
      }

      function drawPalmTree(tx, ty, flip) {
        const d = flip ? -1 : 1;
        // Trunk (curved)
        for (let i = 0; i < 35; i++) {
          const curve = Math.sin(i * 0.08) * 4 * d;
          const tw = Math.max(1, 3 - i * 0.06);
          for (let w = -tw; w <= tw; w++) {
            px(tx + curve + w, ty - i, 85, 55, 30);
          }
        }
        // Trunk highlights
        for (let i = 0; i < 35; i++) {
          const curve = Math.sin(i * 0.08) * 4 * d;
          px(tx + curve - 1, ty - i, 100, 70, 40);
        }
        // Fronds
        const topX = tx + Math.sin(35 * 0.08) * 4 * d;
        const topY = ty - 35;
        const frondAngles = [-0.8, -0.4, -0.1, 0.2, 0.5, 0.9];
        frondAngles.forEach((angle, fi) => {
          const len = 18 + (fi % 2) * 6;
          const sway = Math.sin(frame * 0.02 + fi) * 1.5;
          for (let f = 0; f < len; f++) {
            const fx = topX + Math.cos(angle + sway * 0.05) * f * d;
            const fy = topY + Math.sin(angle) * f * 0.6 + f * 0.15;
            px(fx, fy, 20, 60, 30);
            if (f > 3 && f < len - 2) {
              const leafDir = Math.sin(angle) > 0 ? 1 : -1;
              px(fx, fy + leafDir * 1, 25, 70, 35);
              if (f % 3 === 0) px(fx + d, fy + leafDir * 2, 30, 75, 40);
            }
          }
        });
        // Coconuts
        px(topX + d, topY + 2, 100, 70, 30);
        px(topX + d*2, topY + 1, 90, 60, 25);
      }

      function drawRock(rx, ry, rw, rh) {
        for (let dy = 0; dy < rh; dy++) {
          const w = Math.floor(rw * (1 - dy/rh * 0.3));
          for (let dx = -w; dx <= w; dx++) {
            const shade = Math.sin(dx + dy) > 0.3 ? 5 : 0;
            px(rx+dx, ry+dy, 45+shade, 30+shade, 40+shade);
          }
        }
        // Highlights
        for (let i = 0; i < rw; i++) {
          px(rx - rw + i, ry, 65, 50, 55);
        }
      }

      function drawSand(time) {
        for (let y = HORIZON + 55; y < LH; y++) {
          for (let x = 0; x < LW; x++) {
            const wave = Math.sin(x * 0.08 + time * 0.02) * 2;
            const edge = Math.sin(x * 0.15) * 3;
            if (y > HORIZON + 55 + wave + edge) {
              const t = (y - HORIZON - 55) / (LH - HORIZON - 55);
              const c = lerpColor([210,170,100], [190,150,85], t);
              const noise = (Math.sin(x*7+y*3)*5);
              px(x, y, c[0]+noise, c[1]+noise, c[2]+noise);
            }
          }
        }
      }

      function drawSunsetWater(time) {
        for (let y = HORIZON; y < LH - 20; y++) {
          const depth = (y - HORIZON) / (LH - 20 - HORIZON);
          for (let x = 0; x < LW; x++) {
            const wave1 = Math.sin((x + time * 0.5) * 0.08) * 1.5;
            const wave2 = Math.sin((x + time * 0.3) * 0.12) * 1;
            const waveY = y + wave1 + wave2;
            if (waveY < HORIZON) continue;
            const t = depth;
            const c = lerpColor([50,150,170], [20,80,100], t);
            px(x, waveY, c[0], c[1], c[2]);
          }
        }
      }

      function drawSunReflection(time) {
        const cx = 160;
        for (let y = HORIZON; y < LH - 25; y++) {
          const dist = (y - HORIZON) / (LH - 25 - HORIZON);
          const spread = 2 + dist * 8;
          for (let x = cx - spread; x <= cx + spread; x++) {
            if (x < 0 || x >= LW) continue;
            const shimmer = Math.sin((x + time * 1.2) * 0.4) * Math.sin((y + time * 0.8) * 0.3);
            const waveOffset = Math.sin((x + time * 0.5) * 0.08) * 1.5;
            if (shimmer > 0.3) {
              const b = (1 - dist * 0.6) * 0.55;
              const fade = Math.max(0, 1 - Math.abs(x - cx) / spread);
              px(x, y + waveOffset, 255 * b * fade, 210 * b * fade, 90 * b * fade);
            }
          }
        }
      }

      function drawSailboat(bx, by, time) {
        const bob = Math.sin(time * 0.06 + bx * 0.1) * 1.5;
        const y = Math.floor(by + bob);
        // Hull
        for (let i = -7; i <= 7; i++) {
          if (Math.abs(i) <= 7) px(bx+i, y, 50,35,30);
          if (Math.abs(i) <= 5) px(bx+i, y+1, 40,28,25);
        }
        // Mast
        for (let m = 1; m <= 12; m++) px(bx, y-m, 60,40,30);
        // Sail
        for (let s = 0; s < 9; s++) {
          for (let w = 1; w <= 5 - s * 0.4; w++) {
            px(bx+w, y-3-s, 220+Math.sin(s)*10, 190+Math.sin(s)*10, 150);
          }
        }
        // Fisherman (sitting on left side of hull)
        const fx = bx - 4, fy = y - 1;
        if (isNight()) {
          // Night: sleeping, slumped over
          // Body (slumped, shirt)
          px(fx, fy, 180, 60, 50); px(fx+1, fy, 180, 60, 50);
          px(fx, fy-1, 180, 60, 50);
          // Head (tilted forward, sleeping)
          px(fx, fy-2, 210, 170, 130); px(fx+1, fy-2, 210, 170, 130);
          // Red cap (tilted)
          px(fx, fy-3, 200, 40, 40); px(fx+1, fy-3, 200, 40, 40);
          px(fx-1, fy-3, 200, 40, 40);
          // Legs (dangling)
          px(fx, fy+1, 50, 70, 100); px(fx+1, fy+1, 50, 70, 100);
          // Zzz floating up
          const zOff = Math.sin(time * 0.05) * 1;
          px(fx+2, fy-5 + zOff, 180, 200, 255);
          px(fx+3, fy-6 + zOff, 180, 200, 255);
          px(fx+2, fy-7 + zOff, 180, 200, 255);
          px(fx+3, fy-8 + zOff, 180, 200, 255);
        } else {
          // Day: fishing actively
          // Legs (sitting on hull edge)
          px(fx, fy+1, 50, 70, 100); px(fx+1, fy+1, 50, 70, 100);
          // Body (shirt)
          px(fx, fy, 180, 60, 50); px(fx+1, fy, 180, 60, 50);
          // Arms: one holding rod, one resting
          px(fx+2, fy, 210, 170, 130); // right arm extended
          px(fx+3, fy-1, 210, 170, 130); // arm up to rod
          // Head
          px(fx, fy-2, 210, 170, 130); px(fx+1, fy-2, 210, 170, 130);
          // Eyes (looking at water)
          px(fx+1, fy-2, 40, 30, 30);
          // Red cap
          px(fx, fy-3, 200, 40, 40); px(fx+1, fy-3, 200, 40, 40);
          px(fx+2, fy-3, 200, 40, 40); // cap brim
          // Fishing rod (line from hand into water)
          const rodTipX = fx + 8, rodTipY = fy - 6;
          // Rod pole
          for (let r = 0; r < 7; r++) {
            const t = r / 6;
            const rx = lerp(fx+3, rodTipX, t);
            const ry = lerp(fy-1, rodTipY, t);
            px(rx, ry, 100, 70, 40);
          }
          // Fishing line (from rod tip down into water)
          const lineSwing = Math.sin(time * 0.08) * 0.5;
          for (let l = 0; l < 14; l++) {
            const lx = rodTipX + Math.sin(l * 0.2 + time * 0.04) * 0.5 + lineSwing;
            const ly = rodTipY + l;
            if (ly <= y + 3) px(lx, ly, 200, 200, 200);
          }
          // Bobber (small red dot at water surface)
          const bobberX = rodTipX + Math.sin(time * 0.04) * 0.5 + lineSwing;
          const bobberY = y + 2;
          px(bobberX, bobberY, 220, 50, 50);
          px(bobberX, bobberY - 1, 220, 50, 50);
        }
        // Hull reflection — subtle water-colored shimmer
        for (let r = 1; r < 5; r++) {
          const rr = Math.sin(time * 0.12 + r * 1.3) * 0.5 + 0.5;
          if (rr > 0.3) {
            const alpha = 0.25 + rr * 0.15;
            const bxr = bx + Math.sin(time * 0.08 + r) * 2;
            px(bxr, y + 2 + r, 35 + 20 * rr, 110 + 20 * rr, 130 + 15 * rr);
          }
        }
      }

      // =================== NIGHT SCENE ===================

      function drawNightSky() {
        for (let y = 0; y < HORIZON; y++) {
          const t = y / HORIZON;
          const c = lerpColor([8,12,35], [15,25,55], t);
          rect(0, y, LW, 1, c[0], c[1], c[2]);
        }
      }

      function drawStars(time) {
        const seed = 42;
        for (let i = 0; i < 60; i++) {
          const x = ((i * 137 + seed) % LW);
          const y = ((i * 89 + seed) % Math.floor(HORIZON * 0.7));
          const twinkle = Math.sin(time * 0.05 + i * 2.3);
          const brightness = 0.4 + twinkle * 0.4;
          const size = (i % 5 === 0) ? 2 : 1;
          for (let dx = 0; dx < size; dx++) {
            for (let dy = 0; dy < size; dy++) {
              px(x+dx, y+dy, 255*brightness, 255*brightness, 255*brightness);
            }
          }
        }
      }

      function drawMoon(time) {
        const mx = 200, my = 30;
        const r = 14;
        for (let dy = -r; dy <= r; dy++) {
          for (let dx = -r; dx <= r; dx++) {
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > r) continue;
            const t = dist / r;
            const c = lerpColor([230,230,240], [180,185,200], t);
            px(mx+dx, my+dy, c[0], c[1], c[2]);
          }
        }
        // Craters
        px(mx-4, my-3, 170,175,185); px(mx-3, my-4, 170,175,185);
        px(mx+3, my+2, 165,170,180); px(mx+4, my+3, 165,170,180);
        px(mx-1, my+5, 175,180,190);
        // Glow
        for (let dy = -r-5; dy <= r+5; dy++) {
          for (let dx = -r-5; dx <= r+5; dx++) {
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < r || dist > r+5) continue;
            const glow = 1 - (dist - r) / 5;
            if (Math.random() < glow * 0.15) {
              px(mx+dx, my+dy, 100,110,150);
            }
          }
        }
      }

      function drawNightCloud(x, y, w) {
        for (let dx = 0; dx < w; dx++) {
          const h = 3 + Math.sin(dx * 0.6) * 2;
          for (let dy = 0; dy < h; dy++) {
            px(x+dx, y+dy, 25,35,60);
          }
        }
      }

      function drawNightMountain(points) {
        drawMountain(points, 12, 18, 38);
      }

      function drawNightWater(time) {
        for (let y = HORIZON; y < LH - 15; y++) {
          const depth = (y - HORIZON) / (LH - 15 - HORIZON);
          for (let x = 0; x < LW; x++) {
            const wave = Math.sin((x + time * 0.3) * 0.1) * 1;
            const y2 = y + wave;
            if (y2 < HORIZON) continue;
            const c = lerpColor([18,30,55], [10,18,35], depth);
            px(x, y2, c[0], c[1], c[2]);
            // Wave highlights
            if (Math.sin((x + time * 0.4) * 0.15) > 0.85 && depth < 0.6) {
              px(x, y2, 30, 45, 70);
            }
          }
        }
      }

      function drawMoonReflection(time) {
        const mx = 200;
        for (let y = HORIZON; y < LH - 15; y++) {
          const dist = (y - HORIZON) / (LH - 15 - HORIZON);
          const spread = 1 + dist * 6;
          for (let x = mx - spread; x <= mx + spread; x++) {
            if (x < 0 || x >= LW) continue;
            const shimmer = Math.sin((x + time * 0.8) * 0.4) * Math.sin((y + time * 0.5) * 0.3);
            const waveOffset = Math.sin((x + time * 0.3) * 0.1) * 1;
            if (shimmer > 0.3) {
              const b = (1 - dist * 0.6) * 0.45;
              const fade = Math.max(0, 1 - Math.abs(x - mx) / spread);
              px(x, y + waveOffset, 80 * b * fade, 90 * b * fade, 140 * b * fade);
            }
          }
        }
      }

      function drawNightShore(time) {
        for (let y = LH - 15; y < LH; y++) {
          for (let x = 0; x < LW; x++) {
            const wave = Math.sin(x * 0.06 + time * 0.03) * 2;
            if (y > LH - 12 + wave) {
              px(x, y, 50, 48, 42);
            }
            // Foam line
            if (Math.abs(y - (LH - 12 + wave)) < 1.5 && Math.sin(x * 0.2 + time * 0.1) > 0) {
              px(x, y, 40, 55, 75);
            }
          }
        }
      }

      // =================== RENDER ===================

      function render() {
        frame++;
        ctx.clearRect(0, 0, LW, LH);

        if (isNight()) {
          // Night scene
          drawNightSky();
          drawStars(frame);
          drawMoon(frame);
          drawNightCloud(40, 25, 30);
          drawNightCloud(130, 40, 25);
          drawNightCloud(250, 20, 20);
          drawNightMountain([[0,HORIZON],[30,HORIZON-30],[80,HORIZON-20],[130,HORIZON-35],[180,HORIZON-15],[230,HORIZON-28],[280,HORIZON-18],[320,HORIZON]]);
          drawNightWater(frame);
          drawMoonReflection(frame);
          drawSailboat(180, HORIZON + 25, frame);
          drawNightShore(frame);
        } else {
          // Sunset scene
          drawSunsetSky();
          drawSun(frame);
          drawSunCloud(30, 15, 40);
          drawSunCloud(240, 22, 35);
          drawSunCloud(120, 8, 25);
          drawBird(80 + Math.sin(frame*0.06)*30, 35, frame);
          drawBird(110 + Math.sin(frame*0.07)*25, 28, frame);
          drawBird(250 + Math.sin(frame*0.05)*20, 42, frame);
          drawMountain([[0,HORIZON],[50,HORIZON-25],[100,HORIZON-15],[150,HORIZON-30],[200,HORIZON-10],[260,HORIZON-22],[320,HORIZON]], 55,40,70);
          drawMountain([[0,HORIZON],[40,HORIZON-15],[90,HORIZON-35],[160,HORIZON-18],[220,HORIZON-28],[300,HORIZON-12],[320,HORIZON]], 45,35,60);
          drawPalmTree(25, HORIZON + 50, false);
          drawPalmTree(280, HORIZON + 48, true);
          drawRock(55, HORIZON + 45, 18, 12);
          drawRock(40, HORIZON + 50, 12, 8);
          drawSunsetWater(frame);
          drawSunReflection(frame);
          drawSailboat(180, HORIZON + 25, frame);
          drawSand(frame);
        }

        requestAnimationFrame(render);
      }

      render();
    })();

    // Splash
    setTimeout(() => {
      const splash = document.getElementById('splashScreen');
      if (splash) splash.classList.add('hidden');
      setTimeout(() => { if (splash) splash.style.display = 'none'; }, 600);
    }, 2000);

    let currentTab = 'login';

    function switchAuthTab(tab) {
      currentTab = tab;
      const indicator = document.getElementById('tabIndicator');
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const registerFields = document.getElementById('registerFields');
      const loginOptions = document.getElementById('loginOptions');
      const submitBtn = document.getElementById('submitBtn');
      const submitText = document.getElementById('submitText');
      const bottomText = document.getElementById('bottomText');
      const passLabel = document.querySelector('label[for="password"]');
      const passGroup = document.getElementById('passwordGroup');
      const hint = document.getElementById('gmailHint');
      const email = document.getElementById('email').value.trim();

      if (hint) hint.style.display = 'none';
      if (passGroup) passGroup.style.display = '';
      if (submitBtn) { submitBtn.disabled = false; submitBtn.style.opacity = ''; submitBtn.style.background = ''; }

      if (tab === 'register') {
        indicator.classList.add('right');
        tabLogin.classList.remove('active');
        tabRegister.classList.add('active');
        registerFields.classList.add('show');
        if (loginOptions) loginOptions.style.display = 'none';
        submitText.textContent = 'Criar conta';
        passLabel.textContent = 'Crie uma senha';
        bottomText.innerHTML = 'Já tem conta? <strong onclick="switchAuthTab(\'login\')">Entrar</strong>';
      } else {
        indicator.classList.remove('right');
        tabRegister.classList.remove('active');
        tabLogin.classList.add('active');
        registerFields.classList.remove('show');
        if (loginOptions) loginOptions.style.display = 'flex';
        submitText.textContent = 'Entrar';
        passLabel.textContent = 'Senha';
        bottomText.innerHTML = 'Não tem conta? <strong onclick="switchAuthTab(\'register\')">Criar agora</strong>';
      }
      checkGmailHint();
    }

    function togglePass() {
      const input = document.getElementById('password');
      const icon = document.getElementById('passIcon');
      if (input.type === 'password') { input.type = 'text'; icon.className = 'fa-solid fa-eye-slash'; }
      else { input.type = 'password'; icon.className = 'fa-solid fa-eye'; }
    }

    function checkGmailHint() {
      var email = document.getElementById('email').value.trim();
      var hint = document.getElementById('gmailHint');
      var passGroup = document.getElementById('passwordGroup');
      var submitBtn = document.getElementById('submitBtn');
      var registerFields = document.getElementById('registerFields');
      if (registerFields && currentTab !== 'register') {
        registerFields.classList.remove('show');
      }
      if (currentTab === 'register') {
        if (hint) hint.style.display = 'none';
        if (passGroup) passGroup.style.display = '';
        if (submitBtn) { submitBtn.textContent = 'Criar conta'; submitBtn.style.background = ''; submitBtn.disabled = false; submitBtn.style.opacity = ''; }
        if (isGmail(email)) {
          if (hint) { hint.textContent = 'Contas Gmail só podem ser criadas com Google. Use "Continuar com Google" acima.'; hint.style.display = 'block'; hint.className = 'auth-msg info'; }
          if (passGroup) passGroup.style.display = 'none';
          if (submitBtn) { submitBtn.textContent = 'Criar conta'; submitBtn.style.background = ''; submitBtn.disabled = true; submitBtn.style.opacity = '0.5'; }
        }
        return;
      }
      if (isGmail(email)) {
        if (hint) { hint.textContent = 'Conta Gmail detectada — será feito login com Google automaticamente.'; hint.style.display = 'block'; hint.className = 'auth-msg info'; }
        if (passGroup) passGroup.style.display = 'none';
        if (submitBtn) { submitBtn.textContent = 'Entrar com Google'; submitBtn.style.background = '#4285f4'; }
      } else {
        if (hint) hint.style.display = 'none';
        if (passGroup) passGroup.style.display = '';
        if (submitBtn) { submitBtn.textContent = 'Entrar'; submitBtn.style.background = ''; }
      }
    }

    function isGmail(email) {
      var e = email.toLowerCase();
      return e.endsWith('@gmail.com') || e.endsWith('@googlemail.com');
    }

    function handleAuth() {
      if (currentTab === 'register') {
        doRegister();
        return;
      }
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      if (!email) {
        var authEl = document.getElementById('auth-message');
        if (authEl) { authEl.textContent = 'Preencha o e-mail.'; authEl.className = 'auth-msg error'; authEl.style.display = 'block'; }
        return;
      }
      if (isGmail(email)) {
        var g = document.getElementById('googleBtn');
        if (g) g.focus();
        if (authEl) { authEl.textContent = 'Contas Gmail usam o botão "Continuar com Google" abaixo.'; authEl.className = 'auth-msg info'; authEl.style.display = 'block'; }
        return;
      }
      if (!password) {
        var authEl2 = document.getElementById('auth-message');
        if (authEl2) { authEl2.textContent = 'Preencha a senha.'; authEl2.className = 'auth-msg error'; authEl2.style.display = 'block'; }
        return;
      }
      doLogin(email, password);
    }

    function doRegister() {
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var fullName = document.getElementById('fullName') ? document.getElementById('fullName').value.trim() : '';
      var authEl = document.getElementById('auth-message');
      var btn = document.getElementById('submitBtn');
      var txt = document.getElementById('submitText');

      if (!email) { if (authEl) { authEl.textContent = 'Preencha o e-mail.'; authEl.className = 'auth-msg error'; authEl.style.display = 'block'; } return; }
      if (isGmail(email)) { if (authEl) { authEl.textContent = 'Contas Gmail usam "Continuar com Google".'; authEl.className = 'auth-msg error'; authEl.style.display = 'block'; } return; }
      if (!password) { if (authEl) { authEl.textContent = 'Preencha a senha.'; authEl.className = 'auth-msg error'; authEl.style.display = 'block'; } return; }
      if (password.length < 6) { if (authEl) { authEl.textContent = 'Senha precisa de no mínimo 6 caracteres.'; authEl.className = 'auth-msg error'; authEl.style.display = 'block'; } return; }

      if (btn) btn.disabled = true;
      if (txt) txt.textContent = 'Criando...';
      if (authEl) { authEl.textContent = 'Criando conta...'; authEl.className = 'auth-msg info'; authEl.style.display = 'block'; }

      firebase.auth().createUserWithEmailAndPassword(email, password)
        .then(function(result) {
          if (fullName && result.user) {
            return result.user.updateProfile({ displayName: fullName }).then(function() {
              return db.ref('users/' + result.user.uid + '/profile').set({
                name: fullName,
                email: email,
                createdAt: firebase.database.ServerValue.TIMESTAMP
              });
            });
          }
        })
        .then(function() {
          if (txt) txt.textContent = 'Criar conta';
          if (btn) btn.disabled = false;
        })
        .catch(function(err) {
          var msg = err.code === 'auth/email-already-in-use' ? 'Este e-mail já foi cadastrado. Faça login.'
            : err.code === 'auth/weak-password' ? 'Senha fraca (mínimo 6 caracteres).'
            : err.code === 'auth/invalid-email' ? 'E-mail inválido.'
            : err.code === 'auth/network-request-failed' ? 'Sem conexão com a internet.'
            : (err.message || 'Erro ao criar conta. Tente novamente.');
          if (authEl) { authEl.textContent = msg; authEl.className = 'auth-msg error'; authEl.style.display = 'block'; }
          if (txt) txt.textContent = 'Criar conta';
          if (btn) btn.disabled = false;
        });
    }

    function doLogin(email, password) {
      var authEl = document.getElementById('auth-message');
      var btn = document.getElementById('submitBtn');
      var txt = document.getElementById('submitText');
      if (btn) btn.disabled = true;
      if (txt) txt.textContent = 'Entrando...';
      if (authEl) { authEl.textContent = 'Entrando...'; authEl.className = 'auth-msg info'; authEl.style.display = 'block'; }
      firebase.auth().signInWithEmailAndPassword(email, password)
        .then(function() { if (txt) txt.textContent = 'Entrar'; if (btn) btn.disabled = false; })
        .catch(function(err) {
          var msg = err.code === 'auth/invalid-credential' ? 'E-mail ou senha incorretos. Se não tem conta, clique em "Criar agora".'
            : err.code === 'auth/user-not-found' ? 'Nenhuma conta encontrada com este e-mail. Criar conta primeiro.'
            : err.code === 'auth/wrong-password' ? 'Senha incorreta. Tente novamente.'
            : err.code === 'auth/too-many-requests' ? 'Muitas tentativas. Aguarde alguns minutos.'
            : err.code === 'auth/invalid-email' ? 'E-mail inválido.'
            : err.code === 'auth/network-request-failed' ? 'Sem conexão com a internet.'
            : (err.message || 'Erro ao entrar. Tente novamente.');
          if (authEl) { authEl.textContent = msg; authEl.className = 'auth-msg error'; authEl.style.display = 'block'; }
          if (txt) txt.textContent = 'Entrar';
          if (btn) btn.disabled = false;
        });
    }

    function handleForgot() {
      const email = document.getElementById('email').value.trim();
      if (!email) { alert('Digite seu e-mail primeiro para redefinir a senha.'); document.getElementById('email').focus(); return; }
      if (typeof firebase !== 'undefined' && firebase.auth) {
        firebase.auth().sendPasswordResetEmail(email)
          .then(() => alert('E-mail de redefinição enviado para ' + email))
          .catch(err => alert('Erro: ' + (err.message || 'Tente novamente.')));
      }
    }

    // Theme initial apply (listeners handled by script.js)
    (function() {
      var stored = localStorage.getItem('pulso-theme') || 'dark';
      var isLight = stored === 'light';
      document.body.classList.toggle('dark-mode', !isLight);
      document.body.classList.toggle('light-theme', isLight);
      var p = document.getElementById('themePill');
      if (p) { p.dataset.theme = stored; p.setAttribute('aria-checked', isLight); }
    })();

    // Daily Quote — alternates biblical / non-biblical, random per visit
    const biblicalQuotes = [
      { text: "A verdade vos libertará.", author: "João 8:32" },
      { text: "Felizes os pobres de espírito, porque deles é o Reino dos Céus.", author: "Mateus 5:3" },
      { text: "Ame ao próximo como a ti mesmo.", author: "Mateus 22:39" },
      { text: "Não se apazigues pelo dia de amanhã, porque o dia de amanhã é de si mesmo.", author: "Provérbios 27:1" },
      { text: "O Senhor é o meu pastor; nada me faltará.", author: "Salmo 23:1" },
      { text: "Tudo posso naquele que me fortalece.", author: "Filipenses 4:13" },
      { text: "Deem graças em todas as circunstâncias.", author: "1 Tessalonicenses 5:18" },
      { text: "O temor do Senhor é o princípio da sabedoria.", author: "Salmo 111:10" },
      { text: "Busquem primeiro o Reino de Deus e a sua justiça, e todas essas coisas lhes serão acrescentadas.", author: "Mateus 6:33" },
      { text: "Não julguem para que não sejam julgados.", author: "Mateus 7:1" },
      { text: "Porque eu bem sei os pensamentos que tenho a vosso respeito, diz o Senhor; pensamentos de paz, e não de mal, para vos dar o fim que esperais.", author: "Jeremias 29:11" },
      { text: "Confia no Senhor de todo o teu coração e não te estribes no teu próprio entendimento.", author: "Provérbios 3:5" },
      { text: "O dinheiro é um servo bom, mas um mau mestre.", author: "Provérbio" },
    ];
    const nonBiblicalQuotes = [
      { text: "O homem é a medida de todas as coisas.", author: "Protágoras" },
      { text: "Só sei que nada sei.", author: "Sócrates" },
      { text: "A riqueza não consiste em possuir grandes bens, mas em ter poucas necessidades.", author: "Epicteto" },
      { text: "O preço de qualquer coisa é a quantidade de vida que você troca por ela.", author: "Henry David Thoreau" },
      { text: "O investimento em conhecimento sempre paga os melhores juros.", author: "Benjamin Franklin" },
      { text: "Os juros compostos são a oitava maravilha do mundo.", author: "Albert Einstein" },
      { text: "Não coloque todos os seus ovos em uma cesta.", author: "Provérbio de investimentos" },
      { text: "A economia é a arte de satisfazer necessidades ilimitadas com recursos limitados.", author: "George Bernard Shaw" },
      { text: "O orçamento não é uma restrição, é uma liberdade.", author: "Desconhecido" },
      { text: "Gaste menos do que ganhe. Invista o resto.", author: "George Clason" },
      { text: "A melhor hora para plantar uma árvore foi há vinte anos. A segunda melhor hora é agora.", author: "Provérbio Chinês" },
      { text: "Disciplina é a ponte entre metas e realizações.", author: "Jim Rohn" },
      { text: "O sucesso é a soma de pequenos esforços repetidos dia após dia.", author: "Robert Collier" },
      { text: "Não há vento favorável para quem não sabe aonde vai.", author: "Sêneca" },
      { text: "Não é que temos pouco tempo, é que desperdiçamos muito dele.", author: "Sêneca" },
      { text: "Quem é pobre não pelo pouco que tem, mas pelo muito que deseja.", author: "Sêneca" },
      { text: "A sorte é o que acontece quando a preparação encontra a oportunidade.", author: "Sêneca" },
      { text: "O melhor investimento é em você mesmo.", author: "Warren Buffett" },
      { text: "Pequenos gastos diários se tornam grandes fortunas com o tempo.", author: "Desconhecido" },
      { text: "Quem poupa, tem. Quem investe, multiplica.", author: "Desconhecido" },
    ];
    // Alternate: even visits = biblical, odd = non-biblical; random within category
    const visitCount = parseInt(sessionStorage.getItem('pulsoVisits') || '0');
    sessionStorage.setItem('pulsoVisits', String(visitCount + 1));
    const pool = visitCount % 2 === 0 ? biblicalQuotes : nonBiblicalQuotes;
    const quote = pool[Math.floor(Math.random() * pool.length)];
    const quoteEl = document.getElementById('dailyQuote');
    if (quoteEl) {
      quoteEl.innerHTML = '"' + quote.text + '" — <em>' + quote.author + '</em>';
    }
  </script>
